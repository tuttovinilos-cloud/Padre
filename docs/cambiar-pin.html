<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#172bd8">
<title>Cambiar PIN · Comanda Padre</title>
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f9;color:#13213a;min-height:100dvh;display:grid;place-items:center;padding:20px;font:14px system-ui,-apple-system,sans-serif}
main{width:min(440px,100%);background:white;border:1px solid #d9deea;border-radius:20px;box-shadow:0 12px 32px #172bd814;padding:clamp(22px,5vw,34px)}
.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#172bd8;color:white;font-weight:900;font-size:24px}
h1{font-size:23px;line-height:1.3;margin:17px 0 9px}
p{color:#526079;line-height:1.65}
label{display:block;font-weight:800;font-size:12px;margin:16px 0 7px}
input{width:100%;padding:12px;border:1px solid #cbd3e6;border-radius:10px;font:inherit;min-height:46px}
button{border:0;border-radius:10px;padding:13px 17px;font-weight:800;cursor:pointer}
#savePin{width:100%;background:#153bff;color:white;margin-top:20px}
#savePin:disabled{opacity:.5;cursor:wait}
#signout{margin-top:8px;width:100%;background:transparent;color:#334155;border:1px solid #e2e8f0}
.message{color:#a32626;font-weight:650;min-height:20px;margin:14px 0 0}.message.success{color:#166534}
.note{background:#f5f7ff;border:1px solid #d9e2fb;border-radius:12px;padding:10px 13px}
</style>
</head><body>
<main>
<div class="logo">T</div>
<h1>Configura tu PIN personal</h1>
<p>Operador: <strong id="operatorName">Comprobando sesión…</strong></p>
<p id="pinStatus" class="note">Consultando el estado del acceso…</p>
<form id="changeForm">
<label for="oldPin">PIN actual o provisional</label>
<input id="oldPin" name="oldPin" type="password" inputmode="numeric" autocomplete="current-password" minlength="4" maxlength="4" pattern="[0-9]{4}" required>
<label for="newPin">Nuevo PIN personal</label>
<input id="newPin" name="newPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" required>
<label for="repeatPin">Repetir nuevo PIN</label>
<input id="repeatPin" name="repeatPin" type="password" inputmode="numeric" autocomplete="new-password" minlength="4" maxlength="4" pattern="[0-9]{4}" required>
<p>Evita claves como 0000, 1234 y secuencias repetidas. Nadie podrá consultar tu nuevo código desde el panel.</p>
<button type="submit" id="savePin">Guardar mi PIN</button>
<div class="message" id="message" role="alert" aria-live="polite"></div>
</form>
<button type="button" id="signout">Salir y volver al acceso</button>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
<script defer src="./padre-config.js?v=3"></script>
<script defer src="./auth.js?v=12"></script>
<script defer src="./cambiar-pin.js?v=12"></script>
</body></html>
